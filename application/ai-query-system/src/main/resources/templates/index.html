<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Query System</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="page">

    <div class="card">

        <div class="header">

            <h1>AI Query System</h1>

            <p>Spring Boot • OpenRouter • DevOps Assignment</p>

        </div>

        <div class="input-section">

            <label for="message">
                Ask your question
            </label>

            <textarea
                    id="message"
                    placeholder="Type your question here..."
                    maxlength="1000"></textarea>

            <button id="askButton" onclick="askAI()">
                Ask AI
            </button>

        </div>

        <div class="response-section">

            <h2>Response</h2>

            <div id="response">

                Your AI response will appear here.

            </div>

        </div>

    </div>

</div>

<script src="/js/script.js"></script>

</body>

</html>
